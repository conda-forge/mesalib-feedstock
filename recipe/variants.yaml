# Override compiler versions for macOS
cxx_compiler_version:
  - if: osx
    then: '20'

c_compiler_version:
  - if: osx
    then: '20'

c_stdlib:
  - if: osx
    then: macosx_deployment_target

c_stdlib_version:
  - if: osx and arm64
    then: '15'
  - if: osx and x86_64
    then: '13'

MACOSX_SDK_VERSION:
  - if: osx and arm64
    then: '15'
  - if: osx and x86_64
    then: '13'
